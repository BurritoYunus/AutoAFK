name: Build Executable

# Push a tag like v2.0.7 to build AutoAFK.zip and publish it as a GitHub release.
# The in-app updater (compiled version) downloads that ZIP from the latest release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Set VERSION from tag
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $v = "${{ github.ref_name }}".TrimStart('v')
        (Get-Content main.py -Encoding utf8) -replace '^VERSION = ".*"$', "VERSION = `"$v`"" | Set-Content main.py -Encoding utf8NoBOM
        Select-String -Path main.py -Pattern '^VERSION ='

    - name: Build updater
      run: pyinstaller AutoAFKUpdater.spec --clean --distpath dist-updater

    - name: Build executable
      run: pyinstaller AutoAFK.spec --clean

    - name: Assemble package
      shell: pwsh
      run: |
        Copy-Item settings.ini.example dist/AutoAFK/settings.ini.example
        Copy-Item README.md dist/AutoAFK/
        Copy-Item update.bat dist/AutoAFK/
        Copy-Item dist-updater/AutoAFKUpdater.exe dist/AutoAFK/_internal/
        foreach ($f in 'LICENSE', 'CHANGELOG.md') { if (Test-Path $f) { Copy-Item $f dist/AutoAFK/ } }

    - name: Create ZIP
      shell: pwsh
      run: Compress-Archive -Path dist/AutoAFK -DestinationPath AutoAFK.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoAFK-Windows
        path: AutoAFK.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: AutoAFK.zip
        # Notes come from the release page; generating them here duplicated them
        generate_release_notes: false
